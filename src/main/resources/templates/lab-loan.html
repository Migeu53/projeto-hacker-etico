<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Empréstimo</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/lab">Voltar</a></nav><div class="container"><div class="card" th:if="${loan!=null}"><h1 th:text="${loan.bookTitle}"></h1><p>ID: <span th:text="${loan.id}"></span></p><p>Usuário: <span th:text="${loan.userName}"></span></p><p>Status: <span th:text="${loan.status}"></span></p><p>Nota privada: <span th:text="${loan.privateNote}"></span></p></div><div class="card" th:if="${loan==null}"><p>Não encontrado.</p></div></div></body></html>
