<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/dashboard">Voltar</a></nav><div class="container"><div class="card"><h1>Área administrativa</h1><h2>Usuários</h2><table><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Perfil</th></tr><tr th:each="u:${users}"><td th:text="${u.id}"></td><td th:text="${u.name}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td></tr></table><h2>Empréstimos</h2><table><tr><th>ID</th><th>Livro</th><th>Usuário</th><th>Status</th></tr><tr th:each="l:${loans}"><td th:text="${l.id}"></td><td th:text="${l.bookTitle}"></td><td th:text="${l.userName}"></td><td th:text="${l.status}"></td></tr></table></div></div></body></html>
