<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Painel</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/">Início</a><a href="/profile">Perfil</a><a href="/lab">Laboratório</a><a th:if="${isAdmin}" href="/admin">Admin</a><a href="/logout">Sair</a></nav><div class="container"><div class="card"><h1>Área autenticada</h1><p>Usuário: <b th:text="${user.name}"></b></p><p>Curso: <b th:text="${user.course}"></b></p></div><div class="card"><h2>Meus empréstimos</h2><div th:each="l:${loans}"><p><b th:text="${l.bookTitle}"></b> — <span th:text="${l.status}"></span></p></div><p th:if="${#lists.isEmpty(loans)}">Nenhum empréstimo.</p></div></div></body></html>
