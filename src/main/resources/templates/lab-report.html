<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Relatório</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/lab">Voltar</a></nav><div class="container"><div class="card"><h1>Relatório interno</h1><p class="warn">Esta página deveria ser acessível apenas pelo administrador.</p><p><b>Flag:</b> <span th:text="${flag}"></span></p><h2>Usuários</h2><table><tr><th>ID</th><th>Nome</th><th>E-mail</th></tr><tr th:each="u:${users}"><td th:text="${u.id}"></td><td th:text="${u.name}"></td><td th:text="${u.email}"></td></tr></table><h2>Empréstimos</h2><table><tr><th>ID</th><th>Livro</th><th>Usuário</th><th>Nota</th></tr><tr th:each="l:${loans}"><td th:text="${l.id}"></td><td th:text="${l.bookTitle}"></td><td th:text="${l.userName}"></td><td th:text="${l.privateNote}"></td></tr></table></div></div></body></html>
